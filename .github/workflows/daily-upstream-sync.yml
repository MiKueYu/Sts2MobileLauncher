name: Daily upstream sync

# 每日（UTC 20:00 = 北京 04:00）检查主仓库 ModinMobileSTS/Sts2MobileLauncher：
#  1. 有新提交 → 拉取并合并到 fork main（冲突时尝试自动合并，失败则开 issue）
#  2. 合并成功且有实际更新 → 触发 build-release.yml 构建并发布 Release
#  3. 无更新 → 静默结束

on:
  schedule:
    - cron: '0 20 * * *'   # UTC 20:00 = Asia/Shanghai 04:00
  workflow_dispatch:
    inputs:
      force_release:
        description: 'Build and release even if no upstream changes'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: write
  issues: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      updated: ${{ steps.merge.outputs.updated }}
      tag: ${{ steps.merge.outputs.tag }}
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream
        id: fetch
        run: |
          git remote add upstream https://github.com/ModinMobileSTS/Sts2MobileLauncher.git || true
          for i in 1 2 3; do
            git fetch upstream main && break || sleep 15
          done
          UPSTREAM_HEAD="$(git rev-parse upstream/main)"
          LOCAL_HEAD="$(git rev-parse HEAD)"
          echo "upstream=$UPSTREAM_HEAD" >> "$GITHUB_OUTPUT"
          echo "local=$LOCAL_HEAD" >> "$GITHUB_OUTPUT"
          if [ "$UPSTREAM_HEAD" = "$LOCAL_HEAD" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Merge upstream main
        id: merge
        if: steps.fetch.outputs.changed == 'true'
        run: |
          set +e
          git merge --no-edit upstream/main
          STATUS=$?
          set -e
          if [ $STATUS -ne 0 ]; then
            echo "updated=conflict" >> "$GITHUB_OUTPUT"
            git merge --abort || true
            exit 0
          fi
          # fork 独有提交 + 新上游提交都要推
          git push origin main
          NEW_COMMITS="$(git rev-list --count HEAD ^upstream/main || echo 0)"
          echo "updated=true" >> "$GITHUB_OUTPUT"

      - name: Open conflict issue
        if: steps.merge.outputs.updated == 'conflict'
        uses: actions/github-script@v7
        with:
          script: |
            const title = `Upstream sync conflict at ${new Date().toISOString().slice(0,10)}`;
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'upstream-conflict'
            });
            if (issues.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title,
                labels: ['upstream-conflict'],
                body: `自动合并上游 \`ModinMobileSTS/Sts2MobileLauncher/main\` 冲突。\n\n上游 HEAD: \`${{ steps.fetch.outputs.upstream }}\`\n\n需要手动 rebase/merge 后推送到 main；推送后 build-release.yml 会自动发布。`
              });
            }

      - name: Trigger build and release
        if: steps.merge.outputs.updated == 'true' || inputs.force_release == true
        run: |
          gh api repos/${{ github.repository }}/dispatches \
            -f event_type=upstream-sync \
            -f 'client_payload[upstream]=${{ steps.fetch.outputs.upstream }}' \
            -f 'client_payload[local]=${{ steps.fetch.outputs.local }}'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summarize
        run: |
          echo "### Sync result" >> "$GITHUB_STEP_SUMMARY"
          echo "- upstream: \`${{ steps.fetch.outputs.upstream }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- local:    \`${{ steps.fetch.outputs.local }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- outcome:  \`${{ steps.merge.outputs.updated || 'no-change' }}\`" >> "$GITHUB_STEP_SUMMARY"
