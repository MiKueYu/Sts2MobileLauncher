name: Build and Release APK

# 构建 importer APK 并发布 GitHub Release。
# 触发：手动、推送到 main、或由每日同步工作流在合并上游更新后调用（repository_dispatch）。

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag (leave empty to auto-generate v0.1.13-YYYYMMDD-HHMMSS)'
        required: false
        default: ''
  push:
    branches: [main]
  repository_dispatch:
    types: [upstream-sync]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          # 完整历史 + 子模块：port-mod 是构建必需的 git submodule
          fetch-depth: 0
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync with upstream before building (for repository_dispatch)
        if: github.event_name == 'repository_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/ModinMobileSTS/Sts2MobileLauncher.git || true
          git fetch upstream main
          if git rev-parse --verify -q "FETCH_HEAD" >/dev/null && [ "$(git rev-parse HEAD)" != "$(git rev-parse FETCH_HEAD)" ]; then
            git merge --no-edit FETCH_HEAD || {
              echo "::error::Merge conflict with upstream; resolve manually."
              exit 1
            }
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK 28.1.13356709 and CMake 3.22.1
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "ndk;28.1.13356709" "cmake;3.22.1" > /dev/null

      - name: Set up .NET 9 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Prepare build environment (.env / local.properties / keystore)
        run: |
          cat > .env <<EOF
          JAVA_HOME=$JAVA_HOME
          ANDROID_HOME=$ANDROID_HOME
          DOTNET_BIN=$(command -v dotnet)
          STS2_ORIGINAL_V1130_REFERENCE_DIR=$PWD/.build-refs/orig-v1131
          RELEASE_KEYSTORE_FILE=$GITHUB_WORKSPACE/.build-refs/debug.keystore
          RELEASE_KEYSTORE_PASSWORD=android
          RELEASE_KEYSTORE_ALIAS=androiddebugkey
          EOF
          cat > local.properties <<EOF
          android.gradle.task=assembleMonoRelease
          android.apk.output=android/build/outputs/apk/mono/release/sts2-re.apk
          android.importer.dist=dist/sts2-re-importer.apk
          android.release_keystore_file=$GITHUB_WORKSPACE/.build-refs/debug.keystore
          android.release_keystore_password=android
          android.release_keystore_alias=androiddebugkey
          runtime.mono_memory_stats_fix=0
          compat.default_reference_flavor=original-v0.113.0
          compat.pack_build_mode=matrix
          compat.bundled_packs_config=tools/android/bundled-compat-packs.json
          compat.asset_dir=android/assets/compat_packs
          compat.worktree_root=.agent/worktrees/compat-packs
          compat.pack_remote=origin
          compat.apply_build_info_patches=1
          EOF
          # CI 内存预算：runner 7GB，仍限制并行以缩短峰值
          cat >> android/gradle.properties <<EOF

          org.gradle.jvmargs=-Xmx2560m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
          org.gradle.workers.max=2
          org.gradle.parallel=false
          EOF

      - name: Fetch original v0.113.1 compile-gate references
        run: |
          # 编译门引用优先从 repository secret 提供的 base64 归档还原：
          #   secrets.ORIG_V1131_TAR_GZ = base64(tar.gz 包含 sts2.dll/GodotSharp.dll/0Harmony.dll)
          # 未配置时 CI 降级为 offline bootstrap 版发布（full compat 缺席会在 Release 说明标注）。
          mkdir -p .build-refs/orig-v1131
          if [ -n "${{ secrets.ORIG_V1131_TAR_GZ }}" ]; then
            echo "${{ secrets.ORIG_V1131_TAR_GZ }}" | base64 -d | tar xz -C .build-refs/orig-v1131
            ls -la .build-refs/orig-v1131
          else
            echo "::notice::ORIG_V1131_TAR_GZ secret not set; building without full compat pack."
          fi

      - name: Restore original reference cache
        uses: actions/cache@v4
        with:
          path: .build-refs/orig-v1131
          key: orig-v1131-ref

      - name: Populate original references (from cache or skip gate)
        run: |
          if [ ! -f .build-refs/orig-v1131/sts2.dll ]; then
            echo "::warning::No sts2.dll compile gate; full compat pack will be skipped."
            echo "SKIP_FULL_COMPAT=1" >> "$GITHUB_ENV"
          fi

      - name: Sync runtime from references
        run: bash tools/android/sync-runtime-from-references.sh

      - name: Build compat artifacts
        run: |
          if [ "${SKIP_FULL_COMPAT:-0}" = "1" ]; then
            # 无编译门时退回 fallback：offline bootstrap 兜底包（发布说明会标注无 full compat）
            bash offline-bootstrap/tools/build-offline-pack.sh
            mkdir -p android/assets/compat_packs
            cp offline-bootstrap/dist/offline-bootstrap/*.zip android/assets/compat_packs/
          else
            bash tools/android/build-port-mod.sh
            bash tools/android/stage-bundled-compat-artifacts.sh
          fi

      - name: Build importer APK
        run: |
          GRADLE_ARGS=(assembleMonoRelease
            "-Prelease_keystore_file=$GITHUB_WORKSPACE/.build-refs/debug.keystore"
            "-Prelease_keystore_password=android"
            "-Prelease_keystore_alias=androiddebugkey")
          bash tools/android/gradle-with-s2-env.sh "${GRADLE_ARGS[@]}"
          mkdir -p dist
          cp -f android/build/outputs/apk/mono/release/sts2-re.apk dist/sts2-re-importer.apk
          rm -f dist/sts2-re-importer.apk.idsig
          sha256sum dist/sts2-re-importer.apk

      - name: Verify APK signatures
        run: |
          java --class-path "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" \
            tools/package/VerifyApkSignatures.java dist/sts2-re-importer.apk

      - name: Generate release tag
        id: tag
        run: |
          if [ -n "${{ github.event.inputs.release_tag }}" ]; then
            TAG="${{ github.event.inputs.release_tag }}"
          else
            VERSION=$(grep -oP 'versionName\s+\K"[^"]+"' android/gradle.properties | tr -d '"' | head -1)
            [ -z "$VERSION" ] && VERSION="v0.1.13"
            TAG="${VERSION}-$(date +'%Y%m%d')-$(date +'%H%M%S')"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Read upstream changelog for release notes
        if: github.event_name == 'repository_dispatch'
        run: |
          {
            echo "### Upstream updates included"
            echo ""
            git log --oneline HEAD~20..HEAD 2>/dev/null | head -20 || true
          } > release-notes.md || true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          body_path: release-notes.md
          draft: false
          prerelease: false
          files: dist/sts2-re-importer.apk
          fail_on_unmatched_files: true
